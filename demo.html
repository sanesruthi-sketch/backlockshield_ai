<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusIQ — AI Student Success & Predictive Retention Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM & Babel with Cloudflare CDN for Ultra-Reliable Execution -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-panel { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
    .ai-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); }
    .pulse-alert { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect } = React;

    // --- Mock Academic Data ---
    const studentData = {
      name: "Alex Rivera",
      rollNumber: "23CS048",
      email: "a.rivera@campus.edu",
      cgpa: 3.78,
      department: "Computer Science & Engineering",
      semester: "Semester 6",
      retentionProb: 94.2,
      attendance: 87.5,
      assignmentRate: 92.0,
      riskScore: 28.4,
      riskCategory: "Low",
    };

    const initialCourses = [
      { code: "MA-204", name: "Applied Linear Algebra", credits: 4, grade: 67.4, letter: "C+", attendance: 71.0, risk: "Critical", instructor: "Prof. Elena Rostova", assignments: "4/7" },
      { code: "CS-301", name: "Algorithms & Data Structures", credits: 4, grade: 78.8, letter: "B", attendance: 82.5, risk: "Moderate", instructor: "Dr. James Thorne", assignments: "6/7" },
      { code: "AI-401", name: "Machine Learning & Neural Nets", credits: 4, grade: 94.2, letter: "A", attendance: 95.0, risk: "Low", instructor: "Dr. Evelyn Vance", assignments: "7/7" },
      { code: "CS-312", name: "Distributed Database Systems", credits: 3, grade: 91.5, letter: "A-", attendance: 96.5, risk: "Low", instructor: "Prof. Alan Turing", assignments: "6/6" },
      { code: "CS-305", name: "Computer Networks & Protocols", credits: 3, grade: 88.0, letter: "B+", attendance: 93.3, risk: "Low", instructor: "Dr. Radia Perlman", assignments: "5/5" },
    ];

    const initialTopics = [
      { id: 1, course: "MA-204", topic: "Singular Value Decomposition (SVD)", mastery: 42.0, status: "priority learning gap", attempts: 2 },
      { id: 2, course: "MA-204", topic: "Eigenvalue & Diagonalization", mastery: 58.5, status: "needs practice", attempts: 3 },
      { id: 3, course: "CS-301", topic: "Dynamic Programming Memoization", mastery: 64.0, status: "needs practice", attempts: 4 },
      { id: 4, course: "AI-401", topic: "Convolutional Neural Networks (CNN)", mastery: 92.0, status: "provisional mastery", attempts: 5 },
      { id: 5, course: "CS-312", topic: "Raft Distributed Consensus", mastery: 88.0, status: "provisional mastery", attempts: 4 },
      { id: 6, course: "CS-305", topic: "BGP Routing & Peering", mastery: null, status: "NOT ASSESSED", attempts: 0 },
    ];

    const initialTasks = [
      { id: 1, day: "Today (Saturday)", task: "Review Singular Value Decomposition (SVD) proofs", topic: "MA-204 SVD", plannedMinutes: 45, actualMinutes: 0, completed: false, priority: "High" },
      { id: 2, day: "Tomorrow (Sunday)", task: "Solve 4 Eigenvalue diagonalization drill exercises", topic: "MA-204 Eigenvalues", plannedMinutes: 45, actualMinutes: 0, completed: false, priority: "High" },
      { id: 3, day: "Monday", task: "Complete CS-301 Dynamic Programming Knapsack lab", topic: "CS-301 DP", plannedMinutes: 60, actualMinutes: 0, completed: false, priority: "Medium" },
      { id: 4, day: "Tuesday", task: "Watch CampusIQ 3D Matrix Transformations walkthrough", topic: "MA-204 Matrices", plannedMinutes: 30, actualMinutes: 0, completed: false, priority: "High" },
      { id: 5, day: "Wednesday", task: "Submit AI-401 PyTorch Transfer Learning milestone", topic: "AI-401 CNN", plannedMinutes: 90, actualMinutes: 90, completed: true, priority: "Low" },
    ];

    const cohortStudents = [
      { id: 1, name: "Marcus Vance", roll: "23CS012", cgpa: 2.65, attendance: 62.4, grade: 58.2, riskScore: 78.4, risk: "Critical" },
      { id: 2, name: "Sophia Patel", roll: "23CS035", cgpa: 2.90, attendance: 69.1, grade: 64.0, riskScore: 61.2, risk: "High" },
      { id: 3, name: "Alex Rivera", roll: "23CS048", cgpa: 3.78, attendance: 87.5, grade: 85.2, riskScore: 28.4, risk: "Low" },
      { id: 4, name: "Liam Chen", roll: "23CS051", cgpa: 3.15, attendance: 74.0, grade: 73.5, riskScore: 42.1, risk: "Moderate" },
      { id: 5, name: "Emma Watson", roll: "23CS019", cgpa: 3.95, attendance: 96.0, grade: 94.8, riskScore: 8.5, risk: "Low" },
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(studentData);
      const [currentRole, setCurrentRole] = useState('student'); // 'student', 'faculty', 'admin'
      const [activeTab, setActiveTab] = useState('auth'); // 'overview', 'twin', 'planner', 'cohort', 'admin', 'auth'
      const [authMode, setAuthMode] = useState('login'); // 'login', 'signup', 'fastpass'
      const [authEmail, setAuthEmail] = useState('a.rivera@campus.edu');
      const [authPassword, setAuthPassword] = useState('password123');
      const [rememberMe, setRememberMe] = useState(true);
      const [showPassword, setShowPassword] = useState(false);
      const [authNotification, setAuthNotification] = useState(null);
      const [authError, setAuthError] = useState('');
      const [showForgotModal, setShowForgotModal] = useState(false);
      const [isSessionActive, setIsSessionActive] = useState(true);
      const [lastSignedOutUser, setLastSignedOutUser] = useState(null);
      const [sessionStartTime, setSessionStartTime] = useState(new Date().toLocaleTimeString());
      const [registeredUsers, setRegisteredUsers] = useState([
        { email: 'a.rivera@campus.edu', password: 'password123', name: 'Alex Rivera', rollNumber: '23CS048', cgpa: 3.78, department: 'Computer Science & Engineering', semester: 'Semester 6', attendance: 87.5, riskCategory: 'Low', riskScore: 28.4 },
        { email: 'm.vance@campus.edu', password: 'password123', name: 'Marcus Vance', rollNumber: '23CS012', cgpa: 2.65, department: 'Computer Science & Engineering', semester: 'Semester 6', attendance: 62.4, riskCategory: 'Critical', riskScore: 78.4 },
        { email: 's.patel@campus.edu', password: 'password123', name: 'Sophia Patel', rollNumber: '23CS035', cgpa: 2.90, department: 'Computer Science & Engineering', semester: 'Semester 6', attendance: 69.1, riskCategory: 'High', riskScore: 61.2 },
      ]);
      const [signUpForm, setSignUpForm] = useState({
        name: '',
        rollNumber: '',
        email: '',
        department: 'Computer Science & Engineering',
        semester: 'Semester 6',
        targetCgpa: '3.80',
        password: '',
        confirmPassword: '',
        agreeTerms: true
      });

      const [topics, setTopics] = useState(initialTopics);
      const [tasks, setTasks] = useState(initialTasks);
      const [showQuizModal, setShowQuizModal] = useState(false);
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showCourseModal, setShowCourseModal] = useState(null);
      const [showInterveneModal, setShowInterveneModal] = useState(null);
      const [showCopilot, setShowCopilot] = useState(false);
      const [copilotMessages, setCopilotMessages] = useState([
        { sender: 'ai', text: `Hello ${studentData.name}! I am CampusIQ Copilot. I've analyzed your Spring 2026 course records. You have strong momentum, but MA-204 (Applied Linear Algebra) has dropped to 71.0% attendance and needs SVD review. What would you like to examine?` }
      ]);
      const [copilotInput, setCopilotInput] = useState('');
      const [csvValidated, setCsvValidated] = useState(false);
      const [csvCommitted, setCsvCommitted] = useState(false);
      const [mongoStatus, setMongoStatus] = useState({ connected: false, checking: true, cluster: 'blai.dxi8wl7.mongodb.net', db: 'students', coll: 'datas', stats: {} });
      const [isSyncingMongo, setIsSyncingMongo] = useState(false);

      const checkMongoStatus = async () => {
        try {
          const res = await fetch('http://localhost:5000/api/health');
          if (res.ok) {
            const data = await res.json();
            setMongoStatus({
              connected: data.status === 'online',
              checking: false,
              cluster: data.targetCluster || 'blai.dxi8wl7.mongodb.net',
              db: data.database || 'students',
              coll: data.collection || 'datas',
              stats: data.stats || {}
            });
          } else {
            setMongoStatus(prev => ({ ...prev, connected: false, checking: false }));
          }
        } catch (e) {
          setMongoStatus(prev => ({ ...prev, connected: false, checking: false }));
        }
      };

      useEffect(() => {
        checkMongoStatus();
        const interval = setInterval(checkMongoStatus, 10000);
        return () => clearInterval(interval);
      }, []);

      const syncToMongoDB = async (customPayload) => {
        setIsSyncingMongo(true);
        try {
          const payload = customPayload || {
            source: "CampusIQ Demo Web Application",
            action: "MANUAL_TELEMETRY_SYNC",
            cluster: "blai.dxi8wl7.mongodb.net",
            database: "students",
            collection: "datas",
            timestamp: new Date().toISOString(),
            activeStudent: currentUser,
            role: currentRole,
            viewTab: activeTab,
            topicsMasteryState: topics,
            plannerTasksState: tasks,
            registeredStudentsCount: registeredUsers.length
          };
          const res = await fetch('http://localhost:5000/api/datas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            const json = await res.json();
            setAuthNotification({
              type: 'success',
              message: `🍃 Persisted in MongoDB Atlas! (Collection: students.datas · ID: ${json.insertedId})`
            });
            await checkMongoStatus();
          } else {
            setAuthNotification({
              type: 'warning',
              message: 'MongoDB API returned error. State preserved in browser memory.'
            });
          }
        } catch (err) {
          setAuthNotification({
            type: 'info',
            message: 'MongoDB Atlas API offline on port 5000. Data safely stored in browser memory.'
          });
        } finally {
          setIsSyncingMongo(false);
        }
      };

      // Student Sign In Submission
      const handleLoginSubmit = (e) => {
        if (e) e.preventDefault();
        setAuthError('');
        const trimmedEmail = authEmail.trim().toLowerCase();

        if (!trimmedEmail || !trimmedEmail.includes('@')) {
          setAuthError('Please enter a valid university email address.');
          return;
        }

        if (!authPassword) {
          setAuthError('Please enter your account password.');
          return;
        }

        const match = registeredUsers.find(u => u.email.toLowerCase() === trimmedEmail);
        if (match) {
          setCurrentUser(match);
          setIsSessionActive(true);
          setCurrentRole('student');
          setActiveTab('overview');
          setAuthNotification({
            type: 'success',
            message: `Welcome back, ${match.name}! Your Spring 2026 student telemetry is loaded.`
          });
          return;
        }

        // Generic fallback for any email entered in demo
        const generatedName = trimmedEmail.split('@')[0].replace(/[._-]/g, ' ').replace(/(^\w|\s\w)/g, m => m.toUpperCase()) || "Student";
        const newStudent = {
          name: generatedName,
          rollNumber: "23CS" + Math.floor(100 + Math.random() * 900),
          email: trimmedEmail,
          cgpa: 3.75,
          department: "Computer Science & Engineering",
          semester: "Semester 6",
          retentionProb: 92.5,
          attendance: 88.0,
          assignmentRate: 90.0,
          riskScore: 25.0,
          riskCategory: "Low"
        };
        setRegisteredUsers(prev => [...prev, newStudent]);
        setCurrentUser(newStudent);
        setIsSessionActive(true);
        setCurrentRole('student');
        setActiveTab('overview');
        setAuthNotification({
          type: 'success',
          message: `Authenticated as ${newStudent.name} (${newStudent.rollNumber}).`
        });
      };

      // Student Sign Up Submission
      const handleSignUpSubmit = (e) => {
        if (e) e.preventDefault();
        setAuthError('');

        if (!signUpForm.name.trim()) {
          setAuthError('Please provide your Full Name.');
          return;
        }
        if (!signUpForm.rollNumber.trim()) {
          setAuthError('Please enter your Student ID / Roll Number.');
          return;
        }
        if (!signUpForm.email.trim() || !signUpForm.email.includes('@')) {
          setAuthError('Please provide a valid university email address.');
          return;
        }
        if (!signUpForm.password || signUpForm.password.length < 6) {
          setAuthError('Password must be at least 6 characters long.');
          return;
        }
        if (signUpForm.password !== signUpForm.confirmPassword) {
          setAuthError('Passwords do not match. Please re-enter.');
          return;
        }
        if (!signUpForm.agreeTerms) {
          setAuthError('Please accept the CampusIQ academic telemetry guidelines.');
          return;
        }

        const newStudent = {
          name: signUpForm.name.trim(),
          rollNumber: signUpForm.rollNumber.trim().toUpperCase(),
          email: signUpForm.email.trim().toLowerCase(),
          password: signUpForm.password,
          department: signUpForm.department,
          semester: signUpForm.semester,
          cgpa: parseFloat(signUpForm.targetCgpa) || 3.80,
          retentionProb: 95.0,
          attendance: 92.0,
          assignmentRate: 94.0,
          riskScore: 18.0,
          riskCategory: 'Low'
        };

        setRegisteredUsers(prev => [...prev, newStudent]);
        setCurrentUser(newStudent);
        setIsSessionActive(true);
        setCurrentRole('student');
        setActiveTab('overview');
        setAuthNotification({
          type: 'success',
          message: `🎉 Account successfully created for ${newStudent.name} (${newStudent.rollNumber})! Digital Learning Twin initialized.`
        });

        setCopilotMessages([
          { sender: 'ai', text: `Hello **${newStudent.name}**! Welcome to CampusIQ. Your student account (${newStudent.rollNumber} · ${newStudent.department}) is now active. I am your personal AI academic success advisor. How can I assist you today?` }
        ]);

        // Persist student account into MongoDB Atlas cluster
        fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newStudent)
        }).then(r => r.json()).then(res => {
          if (res.success) {
            setAuthNotification({
              type: 'success',
              message: `🎉 Student account for ${newStudent.name} saved to MongoDB Atlas (Database: students, Coll: datas)!`
            });
            checkMongoStatus();
          }
        }).catch(err => {
          console.info('MongoDB offline fallback: saved in browser local memory', err);
        });
      };

      const handleQuickSelectStudent = (studentObj) => {
        setCurrentUser(studentObj);
        setIsSessionActive(true);
        setCurrentRole('student');
        setActiveTab('overview');
        setAuthNotification({
          type: 'success',
          message: `Active persona switched to ${studentObj.name} (${studentObj.rollNumber}).`
        });
      };

      // Student Sign Out Handler
      const handleInitiateSignOut = () => {
        setActiveTab('auth');
        setAuthMode('signout');
        setAuthError('');
      };

      const handleConfirmSignOut = (clearCache = false) => {
        const departingUser = currentUser;
        setLastSignedOutUser(departingUser);
        setIsSessionActive(false);
        setAuthNotification({
          type: 'info',
          message: `👋 You have signed out successfully from ${departingUser.name} (${departingUser.rollNumber}). Session closed.`
        });

        // Audit sign-out event in MongoDB Atlas
        fetch('http://localhost:5000/api/datas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source: "CampusIQ Demo Web Application",
            action: "STUDENT_SIGNOUT",
            cluster: "blai.dxi8wl7.mongodb.net",
            database: "students",
            collection: "datas",
            timestamp: new Date().toISOString(),
            student: departingUser,
            clearedLocalCache: clearCache
          })
        }).then(r => r.json()).then(res => {
          checkMongoStatus();
        }).catch(err => {
          console.info('MongoDB offline fallback for signout log', err);
        });
      };

      const handleReLogin = (studentObj) => {
        const target = studentObj || lastSignedOutUser || registeredUsers[0];
        setCurrentUser(target);
        setIsSessionActive(true);
        setCurrentRole('student');
        setActiveTab('overview');
        setAuthNotification({
          type: 'success',
          message: `🎉 Welcome back, ${target.name}! Session restored successfully.`
        });
      };

      // Quiz grading & EMA calculation
      const handleQuizSubmit = () => {
        if (!selectedAnswer) return;
        setQuizSubmitted(true);
        // EMA update: 0.7 * 42.0 + 0.3 * 100 = 59.4%
        setTopics(prev => prev.map(t => {
          if (t.id === 1) {
            const newMastery = Math.round((0.7 * t.mastery + 0.3 * 100) * 10) / 10;
            return {
              ...t,
              mastery: newMastery,
              status: newMastery >= 70 ? 'provisional mastery' : newMastery >= 50 ? 'needs practice' : 'priority learning gap',
              attempts: t.attempts + 1
            };
          }
          return t;
        }));

        // Persist quiz mastery update into MongoDB Atlas
        fetch('http://localhost:5000/api/learning-twin/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topicId: 1, quizScore: 100 })
        }).then(() => checkMongoStatus()).catch(() => {});
      };

      const handleTaskToggle = (taskId) => {
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const nextDone = !t.completed;
            return { ...t, completed: nextDone, actualMinutes: nextDone ? t.plannedMinutes : 0 };
          }
          return t;
        }));

        // Persist task toggle state into MongoDB Atlas
        fetch(`http://localhost:5000/api/planner/tasks/${taskId}/toggle`, {
          method: 'POST'
        }).then(() => checkMongoStatus()).catch(() => {});
      };

      const handleSendCopilot = (msgText) => {
        const text = msgText || copilotInput;
        if (!text.trim()) return;
        const newMsg = { sender: 'user', text };
        setCopilotMessages(prev => [...prev, newMsg]);
        setCopilotInput('');

        setTimeout(() => {
          let reply = "";
          const lower = text.toLowerCase();
          if (lower.includes("gpa") || lower.includes("raise") || lower.includes("3.9")) {
            reply = "Your current CGPA is 3.78. To cross the 3.90 threshold, prioritize MA-204 (Applied Linear Algebra): raising it from C+ to A- yields a +0.09 CGPA uplift! Additionally, maintaining A's in AI-401 and CS-312 locks in your trajectory.";
          } else if (lower.includes("linear algebra") || lower.includes("svd") || lower.includes("ma-204")) {
            reply = "In MA-204, attendance is currently 71.0% (violating the 75% institutional requirement). Quiz 3 on Singular Value Decomposition scored 42%. I recommend: 1) Take the diagnostic quiz on the Learning Twin tab, 2) Attend Prof. Rostova's office hours on Thursday at 2 PM.";
          } else {
            reply = "Based on verified student telemetry: Cumulative GPA is 3.78 (Dean's List). Focus on remediating MA-204 Linear Algebra to protect your semester standing.";
          }
          setCopilotMessages(prev => [...prev, { sender: 'ai', text: reply }]);
        }, 500);
      };

      return (
        <div className="min-h-screen bg-slate-50 flex">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0 shadow-xl">
            <div>
              <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-indigo-700 flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-500/30">
                  IQ
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight text-white">CampusIQ</h1>
                  <span className="text-[10px] font-mono uppercase tracking-wider text-indigo-400 bg-indigo-950/80 px-2 py-0.5 rounded border border-indigo-800">HacXLerate '26</span>
                </div>
              </div>

              {/* Role Switcher */}
              <div className="p-4 bg-slate-800/60 m-3 rounded-xl border border-slate-700/60">
                <label className="text-xs uppercase font-mono tracking-wider text-slate-400 block mb-2">Switch Active View:</label>
                <div className="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-lg text-xs">
                  <button 
                    onClick={() => { setCurrentRole('student'); setActiveTab('overview'); }}
                    className={`py-1.5 rounded font-medium transition ${currentRole === 'student' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                    Student
                  </button>
                  <button 
                    onClick={() => { setCurrentRole('faculty'); setActiveTab('cohort'); }}
                    className={`py-1.5 rounded font-medium transition ${currentRole === 'faculty' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                    Faculty
                  </button>
                  <button 
                    onClick={() => { setCurrentRole('admin'); setActiveTab('admin'); }}
                    className={`py-1.5 rounded font-medium transition ${currentRole === 'admin' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                    Admin
                  </button>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="p-4 space-y-1.5">
                <button 
                  onClick={() => setActiveTab('auth')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition ${activeTab === 'auth' ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-600/30' : 'text-indigo-300 hover:bg-slate-800 border border-indigo-900/60'}`}>
                  <span className="flex items-center gap-2">
                    <span>🔐</span>
                    <span>Student Login & Sign Up</span>
                  </span>
                  <span className="text-[10px] font-mono uppercase tracking-wider bg-indigo-950 px-1.5 py-0.5 rounded border border-indigo-700/80 text-indigo-300">Portal</span>
                </button>

                {currentRole === 'student' && (
                  <>
                    <button 
                      onClick={() => setActiveTab('overview')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'overview' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800'}`}>
                      📊 Academic Dashboard
                    </button>
                    <button 
                      onClick={() => setActiveTab('twin')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'twin' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800'}`}>
                      🧬 Digital Learning Twin
                    </button>
                    <button 
                      onClick={() => setActiveTab('planner')}

                        🔍 Run Pre-Commit Validation
                      </button>
                    </div>

                    {csvValidated && (
                      <div className="space-y-4 pt-4 border-t border-slate-100">
                        <div className="flex items-center justify-between">
                          <div>
                            <span className="text-xs font-bold text-slate-700">Validation Results: </span>
                            <span className="text-xs font-semibold text-emerald-600">7 Valid Rows</span>, 
                            <span className="text-xs font-semibold text-slate-400 ml-1">0 Errors (100% Quality Pass)</span>
                          </div>
                          {!csvCommitted ? (
                            <button 
                              onClick={() => setCsvCommitted(true)}
                              className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition shadow">
                              💾 Commit 7 Valid Rows to DB
                            </button>
                          ) : (
                            <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200">
                              ✓ Successfully Committed 7 Verified Student Records (Audit Event #104)
                            </span>
                          )}
                        </div>

                        {/* Success Callout */}
                        <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center gap-2">
                          <span className="text-sm font-bold">✓</span>
                          <span><strong>Schema Verified:</strong> All 7 student records passed roll number uniqueness, CGPA bounds (0.0–4.0), and attendance rules.</span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* MODAL 1: Adaptive Quiz Modal */}
          {showQuizModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-100">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[10px] font-mono uppercase bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-bold">MA-204 · Diagnostic</span>
                    <h3 className="font-bold text-slate-800 text-base mt-1">Adaptive Concept Quiz: SVD</h3>
                  </div>
                  <button onClick={() => setShowQuizModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
                </div>

                {!quizSubmitted ? (
                  <>
                    <div className="text-xs text-slate-600 font-medium leading-relaxed">
                      <strong>Question 1 of 1:</strong> In the Singular Value Decomposition $A = U \Sigma V^T$, what do the non-negative diagonal elements of matrix $\Sigma$ represent?
                    </div>

                    <div className="space-y-2 text-xs">
                      {[
                        "A. Eigenvalues of matrix A directly",
                        "B. Singular values of A, which are square roots of eigenvalues of A^T A",
                        "C. Left singular column vectors",
                        "D. Determinants of all 2x2 submatrices"
                      ].map((opt, idx) => (
                        <button 
                          key={idx}
                          onClick={() => setSelectedAnswer(idx)}
                          className={`w-full text-left p-3 rounded-xl border transition ${
                            selectedAnswer === idx ? 'bg-indigo-50 border-indigo-600 font-semibold text-indigo-900' : 'border-slate-200 hover:bg-slate-50'
                          }`}>
                          {opt}
                        </button>
                      ))}
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button onClick={() => setShowQuizModal(false)} className="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500">Cancel</button>
                      <button 
                        disabled={selectedAnswer === null}
                        onClick={handleQuizSubmit}
                        className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-xs font-semibold transition">
                        Submit & Calibrate Twin
                      </button>
                    </div>
                  </>
                ) : (
                  <div className="space-y-3 pt-2">
                    <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center">
                      <div className="text-2xl mb-1">🎉</div>
                      <div className="text-sm font-bold text-emerald-800">100% Correct Score!</div>
                      <p className="text-xs text-emerald-600 mt-1">
                        Option B was correct. Singular values are non-negative square roots of the eigenvalues of $A^T A$.
                      </p>
                    </div>

                    <div className="bg-slate-50 p-3 rounded-xl text-xs space-y-1.5 border border-slate-100">
                      <div className="text-slate-500">Twin Mastery Recalibration:</div>
                      <div className="flex items-center justify-between font-mono">
                        <span>Prior Mastery:</span> <span className="font-bold">42.0%</span>
                      </div>
                      <div className="flex items-center justify-between font-mono text-emerald-600 font-bold">
                        <span>New Calibrated Mastery:</span> <span>59.4% (+17.4%)</span>
                      </div>
                      <div className="text-[11px] text-slate-500 pt-1">
                        Topic status upgraded from <strong>Priority Learning Gap</strong> to <strong>Needs Practice</strong>!
                      </div>
                    </div>

                    <button 
                      onClick={() => setShowQuizModal(false)}
                      className="w-full py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">
                      Done
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL 2: Course Diagnostic Modal */}
          {showCourseModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-100">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-bold text-slate-800 text-base">{showCourseModal.code}: {showCourseModal.name}</h3>
                    <span className="text-xs text-slate-500">{showCourseModal.instructor}</span>
                  </div>
                  <button onClick={() => setShowCourseModal(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-800">
                    <strong>Critical Factor:</strong> Attendance is {showCourseModal.attendance}%. Statutory university regulations require ≥ 75% for exam authorization.
                  </div>

                  <div>
                    <h5 className="font-bold text-slate-700 mb-1">Identified Learning Gaps:</h5>
                    <ul className="list-disc pl-5 text-slate-600 space-y-1">
                      <li>Singular Value Decomposition (Quiz 3 scored 42%)</li>
                      <li>Eigenvalue Projections and Orthogonality</li>
                    </ul>
                  </div>

                  <div>
                    <h5 className="font-bold text-slate-700 mb-1">Recommended Remediation:</h5>
                    <p className="text-slate-600">
                      Attend Thursday 2 PM Office Hours in Math Rm 304 and complete the 7-day SVD revision drill.
                    </p>
                  </div>
                </div>

                <button 
                  onClick={() => setShowCourseModal(null)}
                  className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">
                  Close Diagnostic
                </button>
              </div>
            </div>
          )}

          {/* MODAL 3: Faculty Intervention Modal */}
          {showInterveneModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-100">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-bold text-slate-800 text-base">Advisor Intervention: {showInterveneModal.name}</h3>
                    <span className="text-xs text-slate-500">Roll: {showInterveneModal.roll} · Risk Score: {showInterveneModal.riskScore}</span>
                  </div>
                  <button onClick={() => setShowInterveneModal(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Intervention Type:</label>
                    <select className="w-full p-2 border border-slate-200 rounded-lg text-xs">
                      <option>Tutoring Referral (Math Lab)</option>
                      <option>Mandatory Attendance Meeting</option>
                      <option>Academic Counseling Check-in</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Follow-up Milestone Date:</label>
                    <input type="date" defaultValue="2026-04-10" className="w-full p-2 border border-slate-200 rounded-lg text-xs" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Advisor Notes:</label>
                    <textarea 
                      rows="3" 
                      defaultValue={`Student has 62.4% attendance. Contacted student for urgent peer tutoring referral.`}
                      className="w-full p-2 border border-slate-200 rounded-lg text-xs"
                    />
                  </div>
                </div>

                <button 
                  onClick={() => { alert(`Intervention ticket saved for ${showInterveneModal.name}!`); setShowInterveneModal(null); }}
                  className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition">
                  Save Intervention Record
                </button>
              </div>
            </div>
          )}

          {/* MODAL 4: AI Copilot Chat Modal */}
          {showCopilot && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-xl w-full h-[600px] shadow-2xl flex flex-col border border-slate-100">
                <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-indigo-50 to-purple-50 rounded-t-2xl">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">✨</span>
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">CampusIQ Academic Copilot</h3>
                      <span className="text-[10px] text-indigo-600 font-mono">Grounded in verified student records</span>
                    </div>
                  </div>
                  <button onClick={() => setShowCopilot(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
                  {copilotMessages.map((m, i) => (
                    <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[85%] p-3 rounded-2xl leading-relaxed ${
                        m.sender === 'user' ? 'bg-indigo-600 text-white font-medium rounded-br-xs' : 'bg-slate-100 text-slate-800 rounded-bl-xs'
                      }`}>
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>

                {/* Quick Prompt Chips */}
                <div className="p-2 border-t border-slate-100 flex gap-2 overflow-x-auto text-[11px] bg-slate-50/50">
                  <button 
                    onClick={() => handleSendCopilot("How can I raise my GPA to 3.90?")}
                    className="whitespace-nowrap px-2.5 py-1 rounded-full bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition">
                    💡 How to raise GPA to 3.90?
                  </button>
                  <button 
                    onClick={() => handleSendCopilot("Why is MA-204 flagged as critical?")}
                    className="whitespace-nowrap px-2.5 py-1 rounded-full bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition">
                    ⚠️ Why is MA-204 critical?
                  </button>
                </div>

                <div className="p-3 border-t border-slate-100 flex gap-2">
                  <input 
                    type="text" 
                    value={copilotInput} 
                    onChange={e => setCopilotInput(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleSendCopilot()}
                    placeholder="Ask your academic advisor a question..." 
                    className="flex-1 p-2 border border-slate-200 rounded-xl text-xs focus:ring-1 focus:ring-indigo-500 outline-hidden" 
                  />
                  <button 
                    onClick={() => handleSendCopilot()}
                    className="px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl hover:bg-indigo-700 transition">
                    Send
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("CampusIQ ErrorBoundary caught error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl text-center space-y-4">
                <span className="text-4xl">⚠️</span>
                <h2 className="text-lg font-bold text-white">CampusIQ Recovery Mode</h2>
                <p className="text-xs text-slate-300">A rendering issue occurred. Academic state is preserved.</p>
                <div className="p-3 bg-slate-950 rounded-xl text-left font-mono text-[11px] text-rose-300 overflow-auto max-h-32">
                  {this.state.error ? this.state.error.toString() : 'Unknown error'}
                </div>
                <button
                  onClick={() => window.location.reload()}
                  className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-xs text-white transition cursor-pointer">
                  Reload Application
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    }
  </script>
</body>
</html>
